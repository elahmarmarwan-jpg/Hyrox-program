<style>

*{box-sizing:border-box;margin:0;padding:0}

header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.brand{display:flex;align-items:center;gap:10px}

.brand b{font-size:20px;letter-spacing:.42em;color:var(--cyan);font-weight:700}

.dot{width:7px;height:7px;border-radius:50%;background:var(--mute2)}.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}.dot.warn{background:var(--amber)}

.hero{border-color:var(--cyan);box-shadow:0 0 24px rgba(61,224,255,.12) inset,0 0 18px rgba(61,224,255,.08)}
.k{font-size:10.5px;color:var(--cyan);display:flex;justify-content:space-between;gap:8px}
.t{font-size:17px;font-weight:700;margin:4px 0 2px}

textarea{min-height:70px;resize:vertical}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.chip{flex:none;font-size:11px;padding:7px 11px;border-radius:999px}
.chip.on{background:var(--cyan);color:#00121A;border-color:var(--cyan)}
.task{border-left:3px solid var(--amber)}

.late{color:var(--red)}.soon{color:var(--amber)}

nav button.on{color:var(--cyan)}

/* ---------- HYROX helpers ---------- */

/* ---------- Sync ---------- */

}

function taskCard(t) {

  const ch = el("div", "chips"); fronts.forEach(f => { const b = el("button", "chip mono" + (front === f ? " on" : ""), f); b.onclick = () => { front = f; render(); }; ch.append(b); }); v.append(ch);

}
function renderHyrox(v) {

  top.append(el("div", "k mono", "HYROX · 18 weeks · final test Fri 26 Mar"), el("div", "t", (s && s.week ? "Week " + s.week + " · " + s.phase : s ? "Kick-off day" : "Program")), el("div", "sub", keys.length + " sessions logged"));

const ME_RX = /dubai|abu dhabi|sharjah|doha|qatar|riyadh|jeddah|saudi|bahrain|kuwait|muscat|oman|cairo|egypt/i;
function renderWatch(v) {

  let items = (w.items || []).slice();

  items.forEach(it => { const [name, when] = String(it).split("|"); const c = el("div", "card"); const k = el("div", "k mono"); k.append(el("span", "", when || ""), el("span", fresh.has(it) ? "new" : ME_RX.test(name) && watchTab === "hyrox" ? "me" : "", fresh.has(it) ? "NEW" : ME_RX.test(name) && watchTab === "hyrox" ? "MIDDLE EAST" : "")); c.append(k, el("div", "t", name)); c.onclick = () => window.open(w.source, "_blank"); v.append(c); });
